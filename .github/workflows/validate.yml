name: Validate AI Security Hub

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  plugin:
    name: Plugin (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install build dependencies
        run: npm ci --ignore-scripts
      - name: Check generated plugin
        run: npm run validate
      - name: Test plugin and session hook
        run: npm test
      - name: Package plugin
        run: node scripts/plugin.mjs package
      - name: Upload plugin bundle
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-security-hub-plugin
          path: dist/ai-security-hub-*
          if-no-files-found: error

  plugin-version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run plugin:check-versions
        env:
          PLUGIN_BASE_SHA: ${{ github.event.pull_request.base.sha }}

  bash:
    name: Bash
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate catalog
        run: ./scripts/validate.sh
      - name: Check generated instructions
        run: ./scripts/build.sh --target . --preset full --mode path-specific --check
      - name: Run Bash tests
        run: ./tests/test-build.sh

  powershell:
    name: PowerShell
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate catalog
        shell: pwsh
        run: .\scripts\validate.ps1
      - name: Check generated instructions
        shell: pwsh
        run: .\scripts\build.ps1 -Target . -Preset full -Mode path-specific -Check
      - name: Run PowerShell tests
        shell: pwsh
        run: .\tests\Test-Build.ps1
